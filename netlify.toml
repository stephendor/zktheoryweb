# ─── Build ────────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─── Dev ──────────────────────────────────────────────────────────────────────

[dev]
  command = "npm run dev"
  port = 4321
  targetPort = 4321

# ─── Security Headers ─────────────────────────────────────────────────────────
# CSP implementation notes (Task 7.4):
#   script-src: 'self' covers dynamically loaded /pagefind/pagefind-ui.js (same-origin).
#     12 inline scripts are covered by SHA-256 hashes (build-time deterministic).
#     JSON-LD blocks (<script type="application/ld+json">) are exempt from script-src.
#     Two hashes (gMV9 = pagefind init, QJZDUlo = Astro islands bootstrap) contain '<'
#     in their minified bodies — the gen-csp-hashes.mjs script uses non-greedy ([\s\S]*?)
#     matching to capture them correctly. Do NOT use [^<]+ regex — it silently drops these.
#     Run `node scripts/gen-csp-hashes.mjs` after any change to BaseLayout.astro,
#     SiteNav.astro, StickyToC.astro, glossary/index.astro, reading-lists/index.astro,
#     learn level-filter pages, or any Astro/Vite/pagefind upgrade (the minifier
#     changes between Vite majors, which changes the emitted script bodies).
#   style-src: 'unsafe-inline' required — rehype-katex emits element-level style="" attributes.
#   font-src: data: required — KaTeX bundles fonts as data: URIs in the compiled CSS.
#   connect-src: 'self' — Pagefind fetch() calls load index chunks from same origin.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-/+xyHT/66E1d619A8TBWsW0/AEwypiwXAuGSgxct44Q=' 'sha256-gMV9/GpJKxhhQJsn4vHeqkPBp3zDyd8BO4L0kAXSXqk=' 'sha256-TZ/dSn+5/ojimw9WBj2hbafp+X8Ovu7IW2Z5VMNfzuk=' 'sha256-CZZgxhk2foFIrW6Fex2Uq3QTPR7liIcKuJw62Gt9+Zc=' 'sha256-QzWFZi+FLIx23tnm9SBU4aEgx4x8DsuASP07mfqol/c=' 'sha256-QJZDUlo/qa5AJCrG6vHyWcatjwCeWidEHQfJc601lzw=' 'sha256-Q2BPg90ZMplYY+FSdApNErhpWafg2hcRRbndmvxuL/Q=' 'sha256-HJp0iUYnJZctr1f73Pw5evL150JsVdRNeXJ98pgcfKo=' 'sha256-eIXWvAmxkr251LJZkjniEK5LcPF3NkapbJepohwYRIc=' 'sha256-xnGRkKPnLImB2MBdKbI+tXncdooulJgv6XPP3eFv9LY=' 'sha256-sdmFYCT4PTqObThYeBDBGP0WRjj+ZKu31d0OlcXZXIY=' 'sha256-8/vfx/i3dyo8Gulfp+zQrup5VJ6BCruvM0ZAfnBe5WE='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

# ─── Static Asset Cache (Astro hashed bundles) ────────────────────────────────

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Font Cache ───────────────────────────────────────────────────────────────

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Pagefind Index Cache ─────────────────────────────────────────────────────
# Shorter TTL — the pagefind index is regenerated with each deploy.

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ─── Redirects ────────────────────────────────────────────────────────────────
# www → apex redirect. HTTP→HTTPS is enforced by Netlify automatically;
# adding an explicit http redirect here would cause redirect loops.

[[redirects]]
  from = "https://www.zktheory.org/*"
  to = "https://zktheory.org/:splat"
  status = 301
  force = true

# ─── Build Hook Note ──────────────────────────────────────────────────────────
# A Zotero build hook can be created in Netlify UI → Site Settings → Build Hooks.
# Once created, call the hook URL from Zotero's server-side processing (e.g., via
# a webhook or scheduled script) to trigger a rebuild whenever the bibliography
# needs to be updated. The hook URL is a POST endpoint — no credentials required.
